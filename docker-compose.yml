services:
  app:
    build: .
    env_file: .env
    environment:
      # SQLite в volume, если в .env не задан другой DATABASE_URL
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/data/crm.db}
    ports:
      # Доступно только с этого компьютера; снаружи — через HTTPS-туннель.
      # APP_BIND=0.0.0.0 откроет порт в локальную сеть.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - crm-data:/app/data   # БД и сессия Telethon переживают перезапуск
    restart: unless-stopped

  # Публичная HTTPS-ссылка через Cloudflare (без регистрации):
  #   docker compose --profile tunnel up -d
  #   docker compose logs tunnel | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com'
  # Адрес меняется при каждом пересоздании контейнера tunnel.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://app:8000
    depends_on:
      - app
    restart: unless-stopped

  # PostgreSQL по желанию: `docker compose --profile postgres up`
  # и DATABASE_URL=postgresql+asyncpg://crm:crm@db:5432/crm в .env
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  crm-data:
  pg-data:
